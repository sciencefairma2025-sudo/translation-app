syntax = "proto3";

package translation;

service TranslationService {
  rpc StreamTranslation(stream AudioChunk) returns (stream TranslatedAudio);
}

message AudioChunk {
  bytes audio_data = 1;
  string source_language = 2;
  string target_language = 3;
  int32 sample_rate = 4;
  string encoding = 5;
}

message TranslatedAudio {
  bytes audio_data = 1;
  string text = 2;
  bool is_final = 3;
}


